<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snewweb – Global News From Every Direction</title>
    <meta name="description" content="NSEW Space - Free global news service with latest headlines from around the world. Stay updated with breaking news, search articles by keyword, and save your favorite stories." />
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://nsewspace.com/">
    <link rel="icon" type="image/png" href="/snewweb-logo.png">

    <!-- Editorial fonts: Newsreader (serif headlines), IBM Plex Sans (UI), IBM Plex Mono (labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NewsWebsite",
      "name": "NSEW Space",
      "description": "NSEW Space - Free global news service with latest headlines from around the world. Stay updated with breaking news, search articles by keyword, and save your favorite stories.",
      "url": "https://nsewspace.com",
      "publisher": {
        "@type": "Organization",
        "name": "NSEW Space",
        "url": "https://nsewspace.com"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://nsewspace.com/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      },
      "sameAs": [
        "https://twitter.com/nsewspace"
      ]
    }
    </script>

    <meta property="og:title" content="NSEW Space - Global News" />
    <meta property="og:description" content="NSEW Space - Free global news service with latest headlines from around the world. Stay updated with breaking news, search articles by keyword, and save your favorite stories." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://nsewspace.com/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@nsewspace" />
    <meta name="twitter:image" content="https://nsewspace.com/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
