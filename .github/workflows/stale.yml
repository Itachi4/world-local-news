name: Stale

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark & close stale issues and PRs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has had no
            activity for 30 days. It will be closed in 7 days if no further activity occurs.
            If this is still relevant, please leave a comment.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has had no
            activity for 14 days. It will be closed in 7 days if no further activity occurs.
            Please rebase or leave a comment if you'd like to keep it open.
          close-issue-message: Closing due to inactivity. Feel free to reopen if still relevant.
          close-pr-message: Closing due to inactivity. Feel free to reopen if still relevant.
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,bug
          exempt-pr-labels: pinned,security,do-not-close
